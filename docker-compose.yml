# WS-1 real-engine services (local, dedicated-service deployment shape).
# Nothing here processes real client data; source stays read-only in the pipeline.
# Images are pinned by digest for reproducibility (Contract 4). Ports bind to loopback
# only — these are unauthenticated services that receive document bytes/OCR text.
services:
  docling:
    image: ghcr.io/docling-project/docling-serve-cpu@sha256:953dec7821c17e2ff67f9bc6f5b924e84371fcf9b87683fe310ed9bfa074cec8
    container_name: ws1-docling
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - HF_HOME=/models          # persist model downloads across restarts
    volumes:
      - docling-models:/models
    restart: unless-stopped

  # Wave 2: PII detection.
  presidio:
    image: mcr.microsoft.com/presidio-analyzer@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
    container_name: ws1-presidio
    ports:
      - "127.0.0.1:3001:3000"    # host 3001 (3000 is commonly taken); container stays 3000
    restart: unless-stopped

  # Wave 3: legacy/binary office extraction (.doc/.xls) + PDF fallback.
  tika:
    image: apache/tika@sha256:a8b442501f601fb15015de974f9afe13dd242b0f14e49a2b144fadcb214a555b
    container_name: ws1-tika
    ports:
      - "127.0.0.1:9998:9998"
    restart: unless-stopped

volumes:
  docling-models:
