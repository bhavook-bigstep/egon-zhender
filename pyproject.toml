[project]
name = "prince-houston-poc"
version = "0.1.0"
description = "Prince Houston Legacy Data Cleansing — PoC (RFP EZ-PH-DC-2026-01)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Databricks notebooks use runtime globals (dbutils/spark/display) — not linted as app code.
extend-exclude = ["datasets/ws1_golden/databricks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Heavy ML libs (installed only for the real semantic/calibration path). Their shipped
# type stubs assume Python >= 3.12 syntax; we do not type-check their internals.
[[tool.mypy.overrides]]
module = ["numpy.*", "scipy.*", "sklearn.*", "sentence_transformers.*", "torch.*", "transformers.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
