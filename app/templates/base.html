<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}WS-1 · Prince Houston PoC{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_ver }}" />
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/app.js?v={{ asset_ver }}" defer></script>
</head>
<body>
  <aside class="sidenav" id="sidenav">
    {% include "_sidebar.html" %}
  </aside>
  <div class="scrim" id="nav-scrim" hidden></div>

  <div class="app-main">
    <header class="topbar">
      <button type="button" id="nav-toggle" class="nav-toggle" aria-label="Menu">≡</button>
      <span class="topbar-title">{{ page_title | default("", true) }}</span>
      <div class="notif-menu">
        <button type="button" id="notif-btn" class="nav-btn" aria-label="Jobs">
          Jobs <span id="notif-badge" class="badge" hidden></span>
        </button>
        <div id="notif-panel" class="notif-panel" hidden>
          <div class="notif-panel-head">
            <span>Jobs &amp; batches</span>
            <button type="button" id="notif-clear" class="notif-clear">Clear completed</button>
          </div>
          <div id="notif-list" class="notif-list"></div>
        </div>
      </div>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      Metadata-only surface · source is read-only · no document content or raw identifiers
      leave the approved boundary. Local PoC (no auth) — bind to 127.0.0.1.
    </footer>
  </div>

  <div id="toasts" aria-live="polite"></div>
</body>
</html>
